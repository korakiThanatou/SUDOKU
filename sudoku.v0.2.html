<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku Interativo com Timer e Dicas</title>
  <style>
    :root {
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --border-color: #333;
      --light-border: #ccc;
      --correct-color: #2e7d32;
      --error-color: #c62828;
      --selected-bg: #e3f2fd;
      --primary-color: #1976d2;
      --hint-color: #f57c00;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      max-width: 480px;
      width: 100%;
    }

    h1 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 15px;
      color: #333;
    }

    .hud-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #eef2f5;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .timer-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-hud {
      padding: 4px 8px;
      font-size: 12px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-hint {
      background-color: var(--hint-color);
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 15px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    select, button {
      padding: 8px 12px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid var(--light-border);
      cursor: pointer;
    }

    .action-btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      transition: background 0.2s;
    }

    .action-btn:hover {
      opacity: 0.9;
    }

    .toggle-label {
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .status {
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      min-height: 20px;
      margin-bottom: 8px;
      color: var(--error-color);
    }

    /* Tabuleiro Sudoku */
    .sudoku-board {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      border: 3px solid var(--border-color);
      margin: 0 auto 15px auto;
      width: 100%;
      aspect-ratio: 1;
      position: relative;
    }

    .cell {
      border: 1px solid var(--light-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
      user-select: none;
      cursor: pointer;
      background: #fff;
    }

    .cell:nth-child(3n) { border-right: 2px solid var(--border-color); }
    .cell:nth-child(9n) { border-right: none; }
    
    .sudoku-board > div:nth-child(n+19):nth-child(-n+27),
    .sudoku-board > div:nth-child(n+46):nth-child(-n+54) {
      border-bottom: 2px solid var(--border-color);
    }

    .cell.given {
      background-color: #f0f0f0;
      color: #000;
      cursor: not-allowed;
    }

    .cell.correct {
      color: var(--correct-color);
      background-color: #e8f5e9;
    }

    .cell.incorrect {
      color: var(--error-color);
      background-color: #ffebee;
    }

    .cell.selected {
      outline: 2px solid var(--primary-color);
      background-color: var(--selected-bg);
    }

    .board-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      font-weight: bold;
      color: #555;
      z-index: 10;
    }

    /* Teclado numérico */
    .numpad {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .numpad button {
      padding: 12px;
      font-size: 18px;
      font-weight: bold;
      background-color: #e0e0e0;
      color: #333;
      border: none;
    }

    .numpad button.erase {
      background-color: #ffcdd2;
      color: #b71c1c;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Sudoku</h1>

  <div class="hud-bar">
    <div class="timer-container">
      ⏱️ <span id="timer-display">00:00</span>
      <button class="btn-hud" id="btn-pause">Pausar</button>
    </div>
    <button class="btn-hud btn-hint" id="btn-hint">💡 Dica (<span id="hint-count">0</span>)</button>
  </div>

  <div class="controls">
    <div class="row">
      <label>Dificuldade:
        <select id="difficulty">
          <option value="easy">Fácil</option>
          <option value="medium" selected>Médio</option>
          <option value="hard">Difícil</option>
        </select>
      </label>
      <button class="action-btn" id="btn-new">Criar Outro</button>
      <button class="action-btn" id="btn-reset">Reiniciar</button>
    </div>

    <div class="row">
      <label class="toggle-label">
        <input type="checkbox" id="limit-errors-toggle" checked>
        Reiniciar após 3 erros
      </label>
      <span id="error-counter">Erros: 0/3</span>
    </div>
  </div>

  <div class="status" id="status-message"></div>

  <div id="board" class="sudoku-board"></div>

  <div class="numpad">
    <button onclick="inputNumber(1)">1</button>
    <button onclick="inputNumber(2)">2</button>
    <button onclick="inputNumber(3)">3</button>
    <button onclick="inputNumber(4)">4</button>
    <button onclick="inputNumber(5)">5</button>
    <button onclick="inputNumber(6)">6</button>
    <button onclick="inputNumber(7)">7</button>
    <button onclick="inputNumber(8)">8</button>
    <button onclick="inputNumber(9)">9</button>
    <button class="erase" onclick="inputNumber(0)">⌫</button>
  </div>
</div>

<script>
  const baseSolution = [
    [5,3,4,6,7,8,9,1,2],
    [6,7,2,1,9,5,3,4,8],
    [1,9,8,3,4,2,5,6,7],
    [8,5,9,7,6,1,4,2,3],
    [4,2,6,8,5,3,7,9,1],
    [7,1,3,9,2,4,8,5,6],
    [9,6,1,5,3,7,2,8,4],
    [2,8,7,4,1,9,6,3,5],
    [3,4,5,2,8,6,1,7,9]
  ];

  let currentSolution = [];
  let initialBoard = [];
  let userBoard = [];
  let selectedCell = null;
  let errorCount = 0;
  let hintsUsed = 0;

  // Timer vars
  let timerSeconds = 0;
  let timerInterval = null;
  let isPaused = false;

  const boardEl = document.getElementById('board');
  const difficultyEl = document.getElementById('difficulty');
  const limitToggleEl = document.getElementById('limit-errors-toggle');
  const errorCounterEl = document.getElementById('error-counter');
  const statusEl = document.getElementById('status-message');
  const timerDisplay = document.getElementById('timer-display');
  const btnPause = document.getElementById('btn-pause');
  const hintCountEl = document.getElementById('hint-count');

  function startTimer() {
    clearInterval(timerInterval);
    timerSeconds = 0;
    isPaused = false;
    btnPause.textContent = 'Pausar';
    updateTimerDisplay();
    timerInterval = setInterval(() => {
      if (!isPaused) {
        timerSeconds++;
        updateTimerDisplay();
      }
    }, 1000);
  }

  function updateTimerDisplay() {
    const mins = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
    const secs = (timerSeconds % 60).toString().padStart(2, '0');
    timerDisplay.textContent = `${mins}:${secs}`;
  }

  function togglePause() {
    isPaused = !isPaused;
    btnPause.textContent = isPaused ? 'Continuar' : 'Pausar';
    renderBoard();
  }

  function shuffleSolution() {
    let nums = [1,2,3,4,5,6,7,8,9].sort(() => Math.random() - 0.5);
    let map = {};
    for(let i=0; i<9; i++) map[i+1] = nums[i];

    return baseSolution.map(row => row.map(val => map[val]));
  }

  function generatePuzzle() {
    currentSolution = shuffleSolution();
    
    let removalCount = 30; // fácil
    if (difficultyEl.value === 'medium') removalCount = 42;
    if (difficultyEl.value === 'hard') removalCount = 54;

    initialBoard = currentSolution.map(row => [...row]);
    
    let removed = 0;
    while (removed < removalCount) {
      let r = Math.floor(Math.random() * 9);
      let c = Math.floor(Math.random() * 9);
      if (initialBoard[r][c] !== 0) {
        initialBoard[r][c] = 0;
        removed++;
      }
    }

    hintsUsed = 0;
    hintCountEl.textContent = hintsUsed;
    startTimer();
    resetGame();
  }

  function resetGame() {
    userBoard = initialBoard.map(row => [...row]);
    errorCount = 0;
    selectedCell = null;
    statusEl.textContent = '';
    updateErrorDisplay();
    renderBoard();
  }

  function updateErrorDisplay() {
    if (limitToggleEl.checked) {
      errorCounterEl.style.display = 'inline';
      errorCounterEl.textContent = `Erros: ${errorCount}/3`;
    } else {
      errorCounterEl.style.display = 'none';
    }
  }

  function renderBoard() {
    boardEl.innerHTML = '';

    if (isPaused) {
      const overlay = document.createElement('div');
      overlay.className = 'board-overlay';
      overlay.textContent = 'Jogo Pausado ⏸️';
      boardEl.appendChild(overlay);
      return;
    }

    for (let r = 0; r < 9; r++) {
      for (let c = 0; c < 9; c++) {
        const cell = document.createElement('div');
        cell.classList.add('cell');

        const val = userBoard[r][c];
        const isGiven = initialBoard[r][c] !== 0;

        if (val !== 0) {
          cell.textContent = val;
          if (isGiven) {
            cell.classList.add('given');
          } else {
            if (val === currentSolution[r][c]) {
              cell.classList.add('correct');
            } else {
              cell.classList.add('incorrect');
            }
          }
        }

        if (selectedCell && selectedCell.r === r && selectedCell.c === c) {
          cell.classList.add('selected');
        }

        cell.addEventListener('click', () => {
          if (!isGiven) {
            selectedCell = { r, c };
            renderBoard();
          }
        });

        boardEl.appendChild(cell);
      }
    }
  }

  function inputNumber(num) {
    if (!selectedCell || isPaused) return;
    const { r, c } = selectedCell;

    if (initialBoard[r][c] !== 0) return;

    if (num === 0) {
      userBoard[r][c] = 0;
      renderBoard();
      return;
    }

    if (num !== currentSolution[r][c]) {
      errorCount++;
      updateErrorDisplay();

      if (limitToggleEl.checked && errorCount >= 3) {
        statusEl.textContent = '3 erros atingidos! Reiniciando fase...';
        setTimeout(resetGame, 1500);
        return;
      }
    }

    userBoard[r][c] = num;
    renderBoard();
    checkWin();
  }

  function giveHint() {
    if (isPaused) return;
    
    // Se houver célula selecionada incorreta ou vazia
    if (selectedCell) {
      const { r, c } = selectedCell;
      if (initialBoard[r][c] === 0 && userBoard[r][c] !== currentSolution[r][c]) {
        userBoard[r][c] = currentSolution[r][c];
        hintsUsed++;
        hintCountEl.textContent = hintsUsed;
        renderBoard();
        checkWin();
        return;
      }
    }

    // Se nenhuma célula estiver selecionada, procura a primeira vazia/incorreta
    for (let r = 0; r < 9; r++) {
      for (let c = 0; c < 9; c++) {
        if (initialBoard[r][c] === 0 && userBoard[r][c] !== currentSolution[r][c]) {
          userBoard[r][c] = currentSolution[r][c];
          selectedCell = { r, c };
          hintsUsed++;
          hintCountEl.textContent = hintsUsed;
          renderBoard();
          checkWin();
          return;
        }
      }
    }
  }

  function checkWin() {
    for (let r = 0; r < 9; r++) {
      for (let c = 0; c < 9; c++) {
        if (userBoard[r][c] !== currentSolution[r][c]) return;
      }
    }
    clearInterval(timerInterval);
    statusEl.style.color = '#2e7d32';
    statusEl.textContent = `Parabéns! Você venceu em ${timerDisplay.textContent}!`;
  }

  document.addEventListener('keydown', (e) => {
    if (e.key >= '1' && e.key <= '9') inputNumber(parseInt(e.key));
    if (e.key === 'Backspace' || e.key === 'Delete') inputNumber(0);
  });

  document.getElementById('btn-new').addEventListener('click', generatePuzzle);
  document.getElementById('btn-reset').addEventListener('click', resetGame);
  document.getElementById('btn-pause').addEventListener('click', togglePause);
  document.getElementById('btn-hint').addEventListener('click', giveHint);
  difficultyEl.addEventListener('change', generatePuzzle);
  limitToggleEl.addEventListener('change', updateErrorDisplay);

  generatePuzzle();
</script>
</body>
</html>
